<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project 520 Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<link rel="stylesheet" href="p520.css?v=20261013h">
<style>
  .legend { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 8px 18px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }

  .week { padding-block: 22px 6px; scroll-margin-top: 80px; }
  .week-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .week-head h2 { font-size: 1.05rem; }
  .week-head .range { color: var(--muted); font-size: 0.9rem; }
  .week-head .phase { font: 600 0.72rem/1 var(--font-head); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 5px 9px; }

  .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
  .day { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 9px; min-width: 0; background: var(--bg); }
  .day.none { visibility: hidden; }
  .day.rest, .day.off, .day.open { background: var(--soft); border-style: dashed; }
  .day.test { border-color: var(--accent); background: var(--accent-soft); }
  .day.today { border-color: var(--today); box-shadow: inset 0 0 0 1px var(--today); }
  .day-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; min-height: 26px; }
  .day-date { font: 700 0.86rem/1 var(--font-head); font-variant-numeric: tabular-nums; }
  .day-date span { font-weight: 600; color: var(--muted); margin-right: 5px; font-size: 0.74rem; letter-spacing: 0.05em; text-transform: uppercase; }
  .day.today .day-date, .day.today .day-date span { color: var(--today); }
  .anki-btn { border: 1px solid var(--line); background: var(--bg); color: var(--muted); border-radius: 6px; padding: 4px 7px; font: 600 0.72rem/1 var(--font-body); cursor: pointer; }
  .anki-btn:hover { color: var(--accent); border-color: var(--accent); }

  .task { display: grid; gap: 3px; min-width: 0; }
  .task .what { font-size: 0.86rem; line-height: 1.35; overflow-wrap: anywhere; }
  .task .subj { display: block; font-size: 0.72rem; color: var(--muted); }
  .task .sub { font-size: 0.76rem; color: var(--muted); }
  .day .note { color: var(--muted); font-size: 0.86rem; }
  .day.test .note { color: var(--accent); font: 800 1.05rem/1.2 var(--font-head); }
  .day > .sub { font-size: 0.8rem; color: var(--muted); }
  .task.check { cursor: pointer; }
  .day .task.cont { margin-top: -3px; }
  .task.check .what { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px; align-items: start; }
  .task.check input { margin: 2px 0 0; width: 15px; height: 15px; accent-color: var(--green); cursor: pointer; }
  .task.check .sub { display: block; }
  .task.done .what, .task.done .sub { color: var(--muted); }
  .task.done .what > span:last-child { text-decoration: line-through; text-decoration-color: var(--muted); }
  .task.done-log .what { color: var(--muted); }
  .status-strip { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; font-size: 0.92rem; }
  .status-strip > span:last-child { flex: 1; min-width: 200px; color: var(--muted); }
  .coach-note { border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 10px 10px 0; padding: 12px 16px; margin-bottom: 14px; }
  .coach-note p { margin: 6px 0 0; }

  .day.catchup { background: var(--green-soft); border-color: transparent; }
  .catchup-note { font-size: 0.8rem; color: var(--green); font-weight: 600; }
  .stack-sm { display: grid; gap: 14px; max-height: 60vh; overflow-y: auto; }

  /* milestones */
  .milestones { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .ms { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; min-width: 0; }
  .ms-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .ms-date { font: 700 0.72rem/1 var(--font-head); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
  .ms-label { font: 700 0.9rem/1.25 var(--font-head); }
  .ms-detail { font-size: 0.8rem; color: var(--muted); }
  .pill.risk { background: var(--amber-soft); color: var(--amber); }
  .pill.up { background: var(--soft); color: var(--muted); }

  /* weekly view */
  .wk-card { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .wk-col { padding: 14px 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
  .wk-col + .wk-col { border-left: 1px solid var(--line); background: var(--soft); }
  .wk-col h3 { font-size: 0.82rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .wk-list { display: grid; gap: 8px; }
  .wk-days { font-size: 0.82rem; color: var(--muted); }
  .wk-card.now { border-color: var(--today); box-shadow: inset 0 0 0 1px var(--today); }
  .sets { display: flex; flex-wrap: wrap; gap: 6px; }
  .set { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 11px 5px 8px; font-size: 0.84rem; cursor: pointer; }
  .set input { margin: 0; accent-color: var(--green); }
  .set.done { color: var(--muted); text-decoration: line-through; }
  .prog-line { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .prog-line i { display: block; height: 100%; background: var(--green); }

  /* phase view */
  .phase-sec { padding-block: 18px 6px; }
  .phase-sec > h2 { margin-bottom: 4px; }
  .phase-sec > .hint { margin-bottom: 12px; }
  details.subj { border: 1px solid var(--line); border-radius: 10px; padding: 0; margin-bottom: 8px; }
  details.subj summary { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 12px 14px; cursor: pointer; list-style: none; }
  details.subj summary::-webkit-details-marker { display: none; }
  details.subj summary .nm { font: 700 0.95rem/1.2 var(--font-head); }
  details.subj summary .ct { font: 700 0.85rem/1 var(--font-head); font-variant-numeric: tabular-nums; color: var(--muted); }
  details.subj summary .prog-line { grid-column: 1 / -1; }
  details.subj .subj-body { padding: 4px 14px 14px; display: grid; gap: 8px; }
  .fl-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .fl-list .task { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  table.qweeks td, table.qweeks th { padding: 7px 8px; }

  @media (max-width: 980px) {
    .days { grid-template-columns: 1fr; gap: 6px; }
    .day.none { display: none; }
    .day { padding: 12px 14px; }
    .day.rest, .day.off, .day.open { flex-direction: row; justify-content: space-between; align-items: center; padding-block: 9px; }
    .day.rest .day-top, .day.off .day-top, .day.open .day-top { min-height: 0; }
    .wk-card { grid-template-columns: 1fr; }
    .wk-col + .wk-col { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<main class="wrap" id="main">
  <div class="page-head" id="head"></div>
  <div class="toolbar" id="toolbar" hidden>
    <div class="legend" aria-label="Legend">
      <span class="kind k-content">Content review</span>
      <span class="kind k-cars">CARS</span>
      <span class="kind k-qbank">Question bank</span>
      <span class="kind k-fl">Full length</span>
    </div>
    <button class="btn btn-plain btn-sm" id="jumpBtn" type="button">Jump to this week</button>
  </div>
  <div id="weeks"></div>
</main>

<dialog id="ankiDlg" aria-labelledby="ankiTitle">
  <div class="dlg-head">
    <div><h2 id="ankiTitle" style="font-size:1.05rem">Anki tags</h2><div class="hint" id="ankiSub"></div></div>
    <button class="btn btn-plain btn-sm" id="ankiClose" type="button">Close</button>
  </div>
  <div class="dlg-body">
    <p class="hint" style="margin:0">Paste a search into Anki's Browse window.</p>
    <div id="ankiList" class="stack-sm"></div>
  </div>
</dialog>

<script src="anki-tags.js?v=20261013h"></script>
<script src="resources.js?v=20261013h"></script>
<script src="engine.js?v=20261013h"></script>
<script src="ui.js?v=20261013h"></script>
<script src="calendar-view.js?v=20261013h"></script>
</body>
</html>
