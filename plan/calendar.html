<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project 520 Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<link rel="stylesheet" href="p520.css">
<style>
  .legend { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 8px 18px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }

  .week { padding-block: 22px 6px; scroll-margin-top: 80px; }
  .week-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .week-head h2 { font-size: 1.05rem; }
  .week-head .range { color: var(--muted); font-size: 0.9rem; }
  .week-head .phase { font: 600 0.72rem/1 var(--font-head); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 5px 9px; }

  .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
  .day { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 9px; min-width: 0; background: var(--bg); }
  .day.none { visibility: hidden; }
  .day.rest, .day.off { background: var(--soft); border-style: dashed; }
  .day.test { border-color: var(--accent); background: var(--accent-soft); }
  .day.today { border-color: var(--today); box-shadow: inset 0 0 0 1px var(--today); }
  .day-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; min-height: 26px; }
  .day-date { font: 700 0.86rem/1 var(--font-head); font-variant-numeric: tabular-nums; }
  .day-date span { font-weight: 600; color: var(--muted); margin-right: 5px; font-size: 0.74rem; letter-spacing: 0.05em; text-transform: uppercase; }
  .day.today .day-date, .day.today .day-date span { color: var(--today); }
  .anki-btn { border: 1px solid var(--line); background: var(--bg); color: var(--muted); border-radius: 6px; padding: 4px 7px; font: 600 0.72rem/1 var(--font-body); cursor: pointer; }
  .anki-btn:hover { color: var(--accent); border-color: var(--accent); }

  .task { display: grid; gap: 3px; min-width: 0; }
  .task .what { font-size: 0.86rem; line-height: 1.35; overflow-wrap: anywhere; }
  .task .subj { display: block; font-size: 0.72rem; color: var(--muted); }
  .task .sub { font-size: 0.76rem; color: var(--muted); }
  .day .note { color: var(--muted); font-size: 0.86rem; }
  .day.test .note { color: var(--accent); font: 800 1.05rem/1.2 var(--font-head); }
  .task.check { cursor: pointer; }
  .task.check .what { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px; align-items: start; }
  .task.check input { margin: 2px 0 0; width: 15px; height: 15px; accent-color: var(--green); cursor: pointer; }
  .task.check .sub { display: block; }
  .task.done .what, .task.done .sub { color: var(--muted); }
  .task.done .what > span:last-child { text-decoration: line-through; text-decoration-color: var(--muted); }
  .task.done-log .what { color: var(--muted); }
  .status-strip { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; font-size: 0.92rem; }
  .status-strip > span:last-child { flex: 1; min-width: 200px; color: var(--muted); }
  .coach-note { border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 10px 10px 0; padding: 12px 16px; margin-bottom: 14px; }
  .coach-note p { margin: 6px 0 0; }

  @media (max-width: 980px) {
    .days { grid-template-columns: 1fr; gap: 6px; }
    .day.none { display: none; }
    .day { padding: 12px 14px; }
    .day.rest, .day.off { flex-direction: row; justify-content: space-between; align-items: center; padding-block: 9px; }
    .day.rest .day-top, .day.off .day-top { min-height: 0; }
  }
</style>
</head>
<body>
<main class="wrap" id="main">
  <div class="page-head" id="head"></div>
  <div class="toolbar" id="toolbar" hidden>
    <div class="legend" aria-label="Legend">
      <span class="kind k-content">Content review</span>
      <span class="kind k-cars">CARS</span>
      <span class="kind k-qbank">Question bank</span>
      <span class="kind k-fl">Full length</span>
    </div>
    <button class="btn btn-plain btn-sm" id="jumpBtn" type="button">Jump to this week</button>
  </div>
  <div id="weeks"></div>
</main>

<dialog id="ankiDlg" aria-labelledby="ankiTitle">
  <div class="dlg-head">
    <div><h2 id="ankiTitle" style="font-size:1.05rem">Anki tags</h2><div class="hint" id="ankiSub"></div></div>
    <button class="btn btn-plain btn-sm" id="ankiClose" type="button">Close</button>
  </div>
  <div class="dlg-body">
    <p class="hint" style="margin:0">Paste a search into Anki's Browse window, select the cards, and unsuspend them.</p>
    <div>
      <div class="row-between" style="margin-bottom:6px"><span class="kind k-content">AM session</span><button class="btn btn-sm" id="copyAm" type="button">Copy AM</button></div>
      <div class="query" id="qAm"></div>
    </div>
    <div>
      <div class="row-between" style="margin-bottom:6px"><span class="kind k-content">PM session</span><button class="btn btn-sm" id="copyPm" type="button">Copy PM</button></div>
      <div class="query" id="qPm"></div>
    </div>
    <div class="row-between"><span></span><button class="btn btn-plain btn-sm" id="copyAll" type="button">Copy AM + PM together</button></div>
  </div>
</dialog>

<script src="resources.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>
<script>
(function () {
  const P = window.P520, UI = window.P520UI;
  const plan = P.loadClientPlan();
  UI.nav("calendar", plan);
  UI.footer(plan);
  const head = document.getElementById("head");
  const weeksEl = document.getElementById("weeks");
  if (!plan) { UI.noPlan(weeksEl); return; }

  const carsLog = P.store.get(P.keyCars(plan.id), []);
  const carsDates = new Set(carsLog.map(r => r.date));
  const cars = P.carsProgress(carsLog);
  const sched = P.buildSchedule(plan, cars.active);
  const today = P.todayDn();
  const D = sched.D;
  const daysLeft = D.test - today;
  const currentWeek = Math.floor((today - D.week1Sun) / 7) + 1;
  const inPlan = currentWeek >= 1 && currentWeek <= sched.weeks.length;
  const phase = P.CARS_PHASES[cars.active - 1];
  let progress = P.loadProgress(plan.id);
  const allChapters = {};
  (D.res ? D.res.chapters : []).forEach(c => allChapters[c.id] = c);

  head.innerHTML =
    '<div><div class="tagline">Study calendar</div>' +
    "<h1>" + (plan.name ? P.esc(plan.name) + "’s MCAT plan" : "Your MCAT plan") + "</h1>" +
    '<p class="lede">Test day is ' + P.longDate(D.test) + ". " +
    (daysLeft > 1 ? daysLeft + " days to go." : daysLeft === 1 ? "That's tomorrow." : daysLeft === 0 ? "That's today. Good luck." : "") +
    " Content review uses " + P.esc(D.res ? D.res.label : "") + "; practice questions use " + P.esc(plan.qbank) + ".</p></div>" +
    '<div class="stats">' +
    '<div class="stat"><b>' + (inPlan ? currentWeek + " / " + sched.weeks.length : sched.weeks.length) + "</b><span>" + (inPlan ? "Current week" : "Weeks in plan") + "</span></div>" +
    '<div class="stat"><b id="statDone">–</b><span>Chapters done</span></div>' +
    '<a class="stat" href="cars.html" style="text-decoration:none;color:inherit"><b>Phase ' + cars.active + "</b><span>CARS: " + phase.name + "</span></a>" +
    "</div>";

  // Coach's note from the latest re-plan
  const last = (plan.history || [])[plan.history.length - 1];
  if (last) {
    const n = document.createElement("div");
    n.className = "coach-note";
    n.innerHTML = '<div class="label">Plan updated ' + P.shortDate(P.dn(last.date)) + " by your coach</div>" +
      (last.note ? "<p>" + P.esc(last.note) + "</p>" : "<p>Your remaining chapters were spread over the days ahead. Earlier days now show what you completed.</p>");
    head.after(n);
  }
  const statusEl = document.createElement("div");
  statusEl.className = "status-strip";
  statusEl.setAttribute("role", "status");
  document.getElementById("toolbar").before(statusEl);

  function renderStatus() {
    const st = P.status(plan, sched, progress, today);
    document.getElementById("statDone").textContent = st.doneCount + " / " + st.total;
    let html;
    if (today < D.start) html = '<span class="pill locked">Not started</span><span>Your plan starts ' + P.longDate(D.start) + ".</span>";
    else if (st.state === "behind") {
      const names = st.missing.slice(0, 3).map(m => P.esc(m.chapter.subject) + " Ch. " + m.chapter.ch).join(", ");
      html = '<span class="pill miss">' + st.behind + (st.behind === 1 ? " chapter" : " chapters") + " behind</span>" +
        "<span>Not checked off yet: " + names + (st.behind > 3 ? ", and " + (st.behind - 3) + " more" : "") +
        ". Check them off as you catch up, and tell your coach if you can't catch up this week.</span>";
    } else if (st.state === "ahead") html = '<span class="pill done">' + st.ahead + (st.ahead === 1 ? " chapter" : " chapters") + " ahead</span><span>Nice work. Everything through today is done.</span>";
    else html = '<span class="pill done">On track</span><span>' + (st.dueToday ? st.dueToday + (st.dueToday === 1 ? " chapter" : " chapters") + " left for today." : "Every chapter through today is checked off.") + "</span>";
    statusEl.innerHTML = html;
  }

  document.getElementById("toolbar").hidden = false;
  const qbankName = P.esc(plan.qbank || "QBank");
  const subj = c => P.esc(c.subject) + " · Ch. " + c.ch;
  const dayMap = new Map();
  const isDone = id => !!progress.ch[id];
  const placed = new Set();
  sched.weeks.forEach(w => w.days.forEach(d => { if (d.am) d.am.concat(d.pm).forEach(c => placed.add(c.id)); }));

  function chapterTask(label, c) {
    const done = isDone(c.id);
    return '<label class="task check' + (done ? " done" : "") + '"><span class="kind k-content">' + label + "</span>" +
      '<span class="what"><input type="checkbox" data-ch="' + c.id + '" data-date=""' + (done ? " checked" : "") + ' aria-label="Done: ' + P.esc(c.label) + '">' +
      '<span><span class="subj">' + subj(c) + "</span>" + P.esc(c.topic) + "</span></span></label>";
  }
  function itemTask(d, kindCls, kindText, what, sub) {
    const key = d.iso + ":p", done = !!progress.items[key];
    return '<label class="task check' + (done ? " done" : "") + '"><span class="kind ' + kindCls + '">' + kindText + "</span>" +
      '<span class="what"><input type="checkbox" data-item="' + key + '"' + (done ? " checked" : "") + ' aria-label="Done: ' + P.esc(what) + '">' +
      "<span>" + P.esc(what) + (sub ? '<span class="sub">' + P.esc(sub) + "</span>" : "") + "</span></span></label>";
  }

  function dayHtml(d) {
    const dow = P.DOW3[d.col];
    const isToday = d.n === today;
    const cls = "day " + d.kind + (isToday ? " today" : "");
    if (d.kind === "none") return '<div class="' + cls + '" aria-hidden="true"></div>';
    let top = '<div class="day-top"><div class="day-date"><span>' + (isToday ? "Today" : dow) + "</span>" + P.md(d.n) + "</div>";
    const hasContent = d.kind === "study" && (d.am.length || d.pm.length);
    if (hasContent) { top += '<button class="anki-btn" type="button" data-day="' + d.n + '" aria-label="Anki tags for ' + P.longDate(d.n) + '">Anki</button>'; dayMap.set(d.n, d); }
    top += "</div>";
    if (d.kind === "test") return '<div class="' + cls + '">' + top + '<div class="note">Test day</div></div>';
    if (d.kind === "off") return '<div class="' + cls + '">' + top + '<div class="note">Off day</div></div>';
    if (d.kind === "rest") return '<div class="' + cls + '">' + top + '<div class="note">Rest / review</div></div>';
    let body = "";
    // Chapters finished this day that the current layout doesn't place anywhere
    // (finished before a re-plan) are listed as done on the day they were checked off.
    const doneThatDay = Object.keys(progress.ch).filter(id => progress.ch[id] === d.iso && allChapters[id] && !placed.has(id));
    body += doneThatDay.map(id => '<div class="task done-log"><span class="kind k-content">Done</span><div class="what"><span class="subj">' + subj(allChapters[id]) + "</span>" + P.esc(allChapters[id].topic) + "</div></div>").join("");
    if (d.beforeReplan && !doneThatDay.length) body += '<div class="task"><span class="kind k-review">Before re-plan</span><div class="what sub">No chapters checked off this day</div></div>';
    d.am.forEach((c, i) => body += chapterTask(i ? "AM, cont." : "AM", c));
    d.pm.forEach((c, i) => body += chapterTask(i ? "PM, cont." : "PM", c));
    if (d.cars) {
      const logged = carsDates.has(d.iso);
      body += '<div class="task' + (logged ? " done" : "") + '"><span class="kind k-cars">CARS' + (logged ? " · logged ✓" : "") + '</span><div class="what">' + P.esc(d.cars.task) + '</div><div class="sub">' + P.esc(d.cars.source) + (logged ? "" : ' · <a href="cars.html">Log it</a>') + "</div></div>";
    }
    const pr = d.practice;
    if (pr.type === "fl") body += itemTask(d, "k-fl", "Full length", "Practice full length", "Log scores after");
    else if (pr.type === "review") body += itemTask(d, "k-review", "Full length", "Full length review", "");
    else body += itemTask(d, "k-qbank", qbankName, pr.text, pr.aligned ? "Content-aligned" : "Mixed subjects");
    return '<div class="' + cls + '">' + top + body + "</div>";
  }

  let html = "";
  for (const w of sched.weeks) {
    if (!w.anyInRange) continue;
    const first = w.days[0].n, last = w.days[6].n;
    const isNow = inPlan && w.num === currentWeek;
    html += '<section class="week" id="week-' + w.num + '"><div class="week-head"><h2>Week ' + w.num + "</h2>" +
      '<span class="range">' + P.shortDate(first) + " – " + P.shortDate(last) + "</span>" +
      '<span class="phase">' + (w.phase === "content" ? "Content review" : "Practice & full lengths") + "</span>" +
      (isNow ? '<span class="pill now">This week</span>' : "") + "</div>" +
      '<div class="days">' + w.days.map(dayHtml).join("") + "</div></section>";
  }
  weeksEl.innerHTML = html;
  renderStatus();

  // Check-offs
  weeksEl.addEventListener("change", e => {
    const box = e.target;
    if (box.type !== "checkbox") return;
    if (box.dataset.ch) {
      if (box.checked) progress.ch[box.dataset.ch] = P.iso(today); else delete progress.ch[box.dataset.ch];
    } else if (box.dataset.item) {
      if (box.checked) progress.items[box.dataset.item] = true; else delete progress.items[box.dataset.item];
    } else return;
    P.saveProgress(plan.id, progress);
    box.closest(".task").classList.toggle("done", box.checked);
    renderStatus();
  });

  const jump = document.getElementById("jumpBtn");
  // Always open on the current week, even after a reload restores an old scroll position.
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  if (inPlan) {
    jump.addEventListener("click", () => document.getElementById("week-" + currentWeek).scrollIntoView({ block: "start" }));
    if (currentWeek > 1) requestAnimationFrame(() => {
      const el = document.getElementById("week-" + currentWeek);
      if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 80, behavior: "instant" });
    });
  } else jump.hidden = true;

  // Anki dialog
  const dlg = document.getElementById("ankiDlg");
  let qa = "", qp = "";
  function setBox(id, q, emptyText) {
    const el = document.getElementById(id);
    el.textContent = q || emptyText;
    el.classList.toggle("empty", !q);
  }
  function chaptersNote(list) {
    const missing = list.filter(c => !c.tag).map(c => c.label);
    return missing.length ? " (no Anki tag yet for: " + missing.join("; ") + ")" : "";
  }
  weeksEl.addEventListener("click", e => {
    const b = e.target.closest(".anki-btn");
    if (!b) return;
    const d = dayMap.get(+b.dataset.day);
    qa = P.ankiQuery(d.am); qp = P.ankiQuery(d.pm);
    document.getElementById("ankiTitle").textContent = "Anki for " + P.longDate(d.n);
    document.getElementById("ankiSub").textContent = "Study day " + d.studyDay + " · Week " + d.week;
    setBox("qAm", qa, d.am.length ? "No Anki tags for this chapter" + chaptersNote(d.am) : "No AM chapter today");
    setBox("qPm", qp, d.pm.length ? "No Anki tags for this chapter" + chaptersNote(d.pm) : "No PM chapter today");
    document.getElementById("copyAm").disabled = !qa;
    document.getElementById("copyPm").disabled = !qp;
    const all = P.ankiQuery(d.am.concat(d.pm));
    document.getElementById("copyAll").hidden = !(qa && qp);
    document.getElementById("copyAll").dataset.q = all;
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
  });
  const copy = (q, msg) => P.copyText(q, ok => UI.toast(ok ? msg : "Couldn't copy. Select the text and copy it."));
  document.getElementById("copyAm").addEventListener("click", () => copy(qa, "AM search copied"));
  document.getElementById("copyPm").addEventListener("click", () => copy(qp, "PM search copied"));
  document.getElementById("copyAll").addEventListener("click", e => copy(e.currentTarget.dataset.q, "AM + PM search copied"));
  document.getElementById("ankiClose").addEventListener("click", () => dlg.close ? dlg.close() : dlg.removeAttribute("open"));
})();
</script>
</body>
</html>
