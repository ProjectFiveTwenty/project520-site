<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project 520 CARS Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<link rel="stylesheet" href="p520.css?v=20261013w">
<style>
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); gap: 20px; align-items: start; }
  .ladder { list-style: none; margin: 0; padding: 0; display: grid; }
  .rung { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .rung:last-child { border-bottom: 0; }
  .rung .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 0.9rem/1 var(--font-head); background: var(--soft); color: var(--muted); }
  .rung.done .n { background: var(--green-soft); color: var(--green); }
  .rung.now .n { background: var(--accent); color: var(--accent-ink); }
  .rung .nm { font: 700 0.95rem/1.2 var(--font-head); }
  .rung .rq { font-size: 0.82rem; color: var(--muted); }
  .bar { height: 6px; border-radius: 999px; background: var(--soft); margin-top: 7px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
  .rung.done .bar i { background: var(--green); }
  .prog { text-align: right; display: grid; gap: 4px; justify-items: end; }
  .prog b { font: 700 0.9rem/1 var(--font-head); font-variant-numeric: tabular-nums; }
  .current { background: var(--accent-soft); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  .current .big { font: 800 1.4rem/1.15 var(--font-head); margin: 4px 0 6px; }
  .guide-card { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; text-decoration: none; color: var(--ink); }
  .guide-card:hover { border-color: var(--accent); }
  .guide-card .label { display: block; margin-bottom: 3px; }
  .guide-t { font-weight: 600; }
  .guide-ic { color: var(--accent); display: grid; }
  .guide-go { color: var(--accent); font-weight: 600; font-size: 0.9rem; white-space: nowrap; }
  @media (max-width: 420px) { .guide-card { grid-template-columns: auto minmax(0, 1fr); } .guide-go { grid-column: 2; } }
  .form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .form-grid .wide { grid-column: span 3; }
  .ok { color: var(--green); font-weight: 700; }
  .bad { color: var(--rose); font-weight: 700; }
  .del { background: none; border: 0; color: var(--muted); cursor: pointer; font: inherit; padding: 4px 6px; border-radius: 4px; }
  .del:hover { color: var(--rose); background: var(--rose-soft); }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  @media (max-width: 520px) { .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .form-grid .wide { grid-column: span 2; } }
</style>
</head>
<body>
<main class="wrap">
  <div class="page-head">
    <div>
      <div class="tagline">CARS performance tracker</div>
      <h1>Mastery-driven progression</h1>
      <p class="lede">Log every CARS session. When you meet a phase's requirements, the next phase unlocks and your calendar's CARS assignments update.</p>
    </div>
  </div>
  <div id="content"></div>
</main>

<script src="anki-tags.js?v=20261013w"></script>
<script src="resources.js?v=20261013w"></script>
<script src="engine.js?v=20261013w"></script>
<script src="sync-config.js?v=20261013w"></script>
<script src="sync.js?v=20261013w"></script>
<script src="ui.js?v=20261013w"></script>
<script>
(function () {
  const P = window.P520, UI = window.P520UI;
  const plan = P.loadClientPlan();
  UI.nav("cars", plan);
  UI.footer(plan);
  const root = document.getElementById("content");
  if (!plan) { UI.noPlan(root); return; }

  const KEY = P.keyCars(plan.id);
  let log = P.store.get(KEY, []);

  root.innerHTML =
    '<div class="layout">' +
    '<div><div class="current" id="current"></div>' +
    '<a class="guide-card" href="cars-guide.html"><span class="guide-ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg></span>' +
    '<span><span class="label">CARS guide</span><span class="guide-t">Need help with this system?</span></span><span class="guide-go">View CARS guide →</span></a>' +
    '<section class="panel"><h2>Phases</h2><ol class="ladder" id="ladder"></ol></section></div>' +
    '<div><section class="panel"><h2>Log a session</h2>' +
    '<form id="logForm" class="form-grid" novalidate>' +
    '<div class="field"><label for="fDate">Date</label><input id="fDate" type="date" required></div>' +
    '<div class="field"><label for="fSource">Source</label><select id="fSource">' + P.CARS_SOURCES.map(s => "<option>" + P.esc(s) + "</option>").join("") + "</select></div>" +
    '<div class="field"><label for="fPhase">Phase</label><select id="fPhase">' + P.CARS_PHASES.map(p => '<option value="' + p.n + '">' + p.n + ". " + P.esc(p.name) + "</option>").join("") + "</select></div>" +
    '<div class="field"><label for="fPass">Passages</label><input id="fPass" type="number" min="1" step="1" inputmode="numeric" required></div>' +
    '<div class="field"><label for="fMin">Total minutes</label><input id="fMin" type="number" min="0" step="0.5" inputmode="decimal" required></div>' +
    '<div class="field"><label for="fQ">Questions</label><input id="fQ" type="number" min="1" step="1" inputmode="numeric" required></div>' +
    '<div class="field"><label for="fC">Correct</label><input id="fC" type="number" min="0" step="1" inputmode="numeric" required></div>' +
    '<div class="field wide"><p class="hint" id="formMsg" role="status"></p><div><button class="btn" type="submit">Add to log</button></div></div>' +
    "</form></section>" +
    '<section class="panel"><div class="row-between" style="margin-bottom:10px"><h2 style="margin:0">Passage log</h2><span class="hint" id="logCount"></span></div>' +
    '<div class="table-scroll"><table class="data"><thead><tr><th>Date</th><th>Source</th><th>Phase</th><th class="r">Passages</th><th class="r">Min / passage</th><th class="r">Accuracy</th><th>Result</th><th></th></tr></thead><tbody id="logBody"></tbody></table></div>' +
    '<p class="hint" id="logEmpty" style="margin-top:12px">No sessions yet. Your first entries count toward Phase 1.</p>' +
    "</section></div></div>";

  const $ = id => document.getElementById(id);
  $("fDate").value = P.iso(P.todayDn());

  function render() {
    const prog = P.carsProgress(log);
    const cur = P.CARS_PHASES[prog.active - 1];
    const curCount = prog.counts[cur.n];
    $("current").innerHTML = '<div class="label">Current phase</div><div class="big">Phase ' + cur.n + ": " + P.esc(cur.name) + "</div>" +
      '<div class="muted">' + P.esc(cur.req) + " · " + Math.min(curCount, cur.goal) + " of " + cur.goal + " " + cur.unit + " done</div>";
    $("ladder").innerHTML = P.CARS_PHASES.map(p => {
      const c = prog.counts[p.n];
      const state = p.n < prog.active || (p.n === 7 && c >= 1) ? "done" : p.n === prog.active ? "now" : "locked";
      const pct = Math.min(100, Math.round(100 * Math.min(c, p.goal) / p.goal));
      const pill = state === "done" ? '<span class="pill done">Completed</span>' : state === "now" ? '<span class="pill now">In progress</span>' : '<span class="pill locked">Locked</span>';
      return '<li class="rung ' + state + '"><div class="n">' + p.n + '</div><div><div class="nm">' + P.esc(p.name) + '</div><div class="rq">' + P.esc(p.req) + '</div><div class="bar"><i style="width:' + pct + '%"></i></div></div>' +
        '<div class="prog"><b>' + Math.min(c, p.goal) + " / " + p.goal + "</b>" + pill + "</div></li>";
    }).join("");
    $("fPhase").value = String(prog.active);

    const rows = log.map((r, i) => ({ r, i })).sort((a, b) => (b.r.date || "").localeCompare(a.r.date || "") || b.i - a.i);
    $("logBody").innerHTML = rows.map(({ r, i }) => {
      const ok = P.carsRowPasses(r);
      const acc = r.questions ? Math.round(100 * r.correct / r.questions) + "%" : "–";
      const per = r.passages ? (r.minutes / r.passages).toFixed(1) : "–";
      return "<tr><td class=\"num\">" + P.esc(r.date) + "</td><td>" + P.esc(r.source) + "</td><td>" + r.phase + ". " + P.esc(P.CARS_PHASES[r.phase - 1].name) + "</td>" +
        '<td class="r">' + r.passages + '</td><td class="r">' + per + '</td><td class="r">' + acc + "</td>" +
        "<td>" + (ok ? '<span class="ok">✓ Met</span>' : '<span class="bad">✗ Not met</span>') + "</td>" +
        '<td><button class="del" type="button" ' + (r.id ? 'data-id="' + P.esc(r.id) + '"' : 'data-i="' + i + '"') + ' aria-label="Delete entry from ' + P.esc(r.date) + '">Delete</button></td></tr>';
    }).join("");
    $("logEmpty").hidden = log.length > 0;
    $("logCount").textContent = log.length ? log.length + (log.length === 1 ? " session" : " sessions") : "";
  }

  $("logForm").addEventListener("submit", e => {
    e.preventDefault();
    const r = {
      id: P.makeId(), date: $("fDate").value, source: $("fSource").value, phase: +$("fPhase").value,
      passages: +$("fPass").value, minutes: +$("fMin").value, questions: +$("fQ").value, correct: +$("fC").value
    };
    const msg = $("formMsg");
    if (!r.date || !r.passages || !r.questions || $("fMin").value === "" || $("fC").value === "") { msg.textContent = "Fill in every field before adding the session."; return; }
    if (r.correct > r.questions) { msg.textContent = "Correct can't be more than the number of questions."; return; }
    log = P.store.get(KEY, []);  // fresh copy, in case another device's changes synced in
    const before = P.carsProgress(log).active;
    log.push(r);
    P.store.set(KEY, log);
    const after = P.carsProgress(log).active;
    msg.textContent = "";
    ["fPass", "fMin", "fQ", "fC"].forEach(id => $(id).value = "");
    render();
    UI.toast(after > before ? "Phase " + after + " unlocked. Your calendar is updated." : P.carsRowPasses(r) ? "Logged. That session met the requirements." : "Logged. That session didn't meet this phase's requirements.");
  });
  $("logBody").addEventListener("click", e => {
    const b = e.target.closest(".del");
    if (!b) return;
    log = P.store.get(KEY, []);
    const at = b.dataset.id ? log.findIndex(x => x.id === b.dataset.id) : +b.dataset.i;
    if (at >= 0) log.splice(at, 1);
    P.store.set(KEY, log);
    render();
    UI.toast("Entry deleted");
  });
  render();
})();
</script>
</body>
</html>
