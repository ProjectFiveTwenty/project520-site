<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project 520 Score Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<link rel="stylesheet" href="p520.css?v=20261014h">
<style>
  .chart-wrap { overflow-x: auto; }
  svg.chart { display: block; width: 100%; min-width: 520px; height: auto; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .axis { fill: var(--muted); font: 500 11px var(--font-body); }
  .chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  .chart .area { fill: var(--accent); opacity: 0.08; }
  .chart .dot { fill: var(--bg); stroke: var(--accent); stroke-width: 2; }
  .chart .dot.last { fill: var(--accent); }
  .chart .val { fill: var(--ink); font: 700 11px var(--font-head); }
  .chart .goal { stroke: var(--green); stroke-dasharray: 4 4; stroke-width: 1.5; }
  .chart .goal-l { fill: var(--green); font: 600 11px var(--font-body); }
  .sec-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .sec-grid .group-label { grid-column: 1 / -1; margin-top: 4px; }
  .del { background: none; border: 0; color: var(--muted); cursor: pointer; font: inherit; padding: 4px 6px; border-radius: 4px; }
  .del:hover { color: var(--rose); background: var(--rose-soft); }
  .total-cell { font: 800 1rem/1 var(--font-head); }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 20px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  @media (max-width: 520px) { .sec-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<main class="wrap">
  <div class="page-head" id="head">
    <div>
      <div class="tagline">Score tracker</div>
      <h1>Full-length practice exams</h1>
      <p class="lede">Log raw and scaled section scores after each practice exam.</p>
    </div>
    <div class="stats" id="stats"></div>
  </div>
  <div id="content"></div>
</main>

<script src="anki-tags.js?v=20261014h"></script>
<script src="resources.js?v=20261014h"></script>
<script src="engine.js?v=20261014h"></script>
<script src="sync-config.js?v=20261014h"></script>
<script src="sync.js?v=20261014h"></script>
<script src="ui.js?v=20261014h"></script>
<script>
(function () {
  const P = window.P520, UI = window.P520UI;
  const plan = P.loadClientPlan();
  UI.nav("scores", plan);
  UI.footer(plan);
  const root = document.getElementById("content");
  if (!plan) { UI.noPlan(root); return; }

  const KEY = P.keyFL(plan.id);
  let log = P.store.get(KEY, []);
  const S = P.FL_SECTIONS;
  const $ = id => document.getElementById(id);

  const secInputs = (prefix, min, maxFn, ph) => S.map(s =>
    '<div class="field"><label for="' + prefix + s.key + '">' + s.label + '</label><input id="' + prefix + s.key + '" type="number" inputmode="numeric" min="' + min + '" max="' + maxFn(s) + '" placeholder="' + ph(s) + '"></div>').join("");

  root.innerHTML =
    '<div class="layout"><div>' +
    '<section class="panel"><h2>Log an exam</h2><form id="flForm" novalidate style="display:grid;gap:14px">' +
    '<div class="grid2"><div class="field"><label for="fDate">Date</label><input id="fDate" type="date"></div>' +
    '<div class="field"><label for="fSrc">Exam</label><select id="fSrc">' + P.FL_SOURCES.map(s => "<option>" + P.esc(s) + "</option>").join("") + "</select></div></div>" +
    '<div class="sec-grid"><div class="label group-label">Raw score (questions correct)</div>' + secInputs("r_", 0, s => s.max, s => "of " + s.max) + "</div>" +
    '<div class="sec-grid"><div class="label group-label">Scaled score</div>' + secInputs("s_", 118, () => 132, () => "118–132") + "</div>" +
    '<p class="hint" id="formMsg" role="status" style="margin:0"></p><div><button class="btn" type="submit">Add exam</button></div>' +
    "</form></section>" +
    '<section class="panel"><h2>Coming up</h2><div id="upcoming"></div></section>' +
    "</div><div>" +
    '<section class="panel"><div class="row-between" style="margin-bottom:8px"><h2 style="margin:0">Total scaled score</h2><span class="hint">472–528</span></div><div class="chart-wrap" id="chart"></div></section>' +
    '<section class="panel"><h2>Exam log</h2><div class="table-scroll"><table class="data"><thead><tr><th>Date</th><th>Exam</th>' +
    S.map(s => '<th class="r">' + s.label + "</th>").join("") + '<th class="r">Total</th><th class="r">Raw %</th><th></th></tr></thead><tbody id="body"></tbody></table></div>' +
    '<p class="hint" id="empty" style="margin-top:12px">No exams logged yet. Start with your diagnostic.</p></section>' +
    "</div></div>";

  $("fDate").value = P.iso(P.todayDn());

  // Upcoming practice full lengths from the calendar
  const sched = P.buildSchedule(plan, P.carsProgress(P.store.get(P.keyCars(plan.id), [])).active);
  const today = P.todayDn();
  const fls = [];
  sched.weeks.forEach(w => w.days.forEach(d => { if (d.kind === "study" && d.practice && d.practice.type === "fl") fls.push(d.n); }));
  const next = fls.filter(n => n >= today).slice(0, 3);
  $("upcoming").innerHTML = next.length
    ? '<ul style="margin:0;padding-left:18px">' + next.map(n => "<li>" + P.longDate(n) + "</li>").join("") + "</ul>" +
      '<p class="hint" style="margin-top:8px">Full length review is the day after each exam. Test day: ' + P.longDate(sched.D.test) + ".</p>"
    : '<p class="hint">No more practice full lengths on your calendar. Test day: ' + P.longDate(sched.D.test) + ".</p>";

  const total = r => S.reduce((a, s) => a + (+r.scaled[s.key] || 0), 0);
  const rawPct = r => Math.round(100 * S.reduce((a, s) => a + (+r.raw[s.key] || 0), 0) / 230);

  function chart(rows) {
    const el = $("chart");
    const pts = rows.filter(r => S.every(s => r.scaled[s.key]));
    if (!pts.length) { el.innerHTML = '<p class="hint">Your score trend appears here once you log an exam with all four scaled scores.</p>'; return; }
    const W = 640, H = 260, L = 44, R = 20, T = 22, B = 34;
    const totals = pts.map(total);
    const goal = +plan.target || 0;
    let lo = Math.min(...totals, goal || Infinity) - 6, hi = Math.max(...totals, goal) + 6;
    lo = Math.max(472, Math.floor(lo / 5) * 5); hi = Math.min(528, Math.ceil(hi / 5) * 5);
    if (hi - lo < 15) { hi = Math.min(528, lo + 15); lo = Math.max(472, hi - 15); }
    const x = i => pts.length === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (pts.length - 1);
    const y = v => T + (hi - v) * (H - T - B) / (hi - lo);
    let g = "";
    for (let v = lo; v <= hi; v += 5) g += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="axis" x="' + (L - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + "</text>";
    const tg = +plan.target;
    if (tg && tg >= lo && tg <= hi) g += '<line class="goal" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(tg) + '" y2="' + y(tg) + '"/><text class="goal-l" x="' + (W - R) + '" y="' + (y(tg) - 6) + '" text-anchor="end">Goal ' + tg + "</text>";
    const path = totals.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
    const area = pts.length > 1 ? '<path class="area" d="' + path + " L" + x(pts.length - 1).toFixed(1) + " " + (H - B) + " L" + x(0).toFixed(1) + " " + (H - B) + ' Z"/>' : "";
    let marks = "";
    pts.forEach((r, i) => {
      const last = i === pts.length - 1;
      marks += '<circle class="dot' + (last ? " last" : "") + '" cx="' + x(i) + '" cy="' + y(totals[i]) + '" r="' + (last ? 5 : 4) + '"><title>' + P.esc(r.source) + ": " + totals[i] + "</title></circle>";
      marks += '<text class="val" x="' + x(i) + '" y="' + (y(totals[i]) - 10) + '" text-anchor="middle">' + totals[i] + "</text>";
      marks += '<text class="axis" x="' + x(i) + '" y="' + (H - B + 18) + '" text-anchor="middle">' + P.shortDate(P.dn(r.date)) + "</text>";
    });
    el.innerHTML = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Total scaled score over time">' + g + area + '<path class="line" d="' + path + '"/>' + marks + "</svg>";
  }

  function render() {
    const rows = log.map((r, i) => ({ r, i })).sort((a, b) => (a.r.date || "").localeCompare(b.r.date || "") || a.i - b.i);
    $("body").innerHTML = rows.slice().reverse().map(({ r, i }) =>
      '<tr><td class="num">' + P.esc(r.date) + "</td><td>" + P.esc(r.source) + "</td>" +
      S.map(s => '<td class="r">' + (r.scaled[s.key] || "–") + '<div class="hint">' + (r.raw[s.key] !== "" && r.raw[s.key] != null ? r.raw[s.key] + "/" + s.max : "") + "</div></td>").join("") +
      '<td class="r total-cell">' + (S.every(s => r.scaled[s.key]) ? total(r) : "–") + '</td><td class="r">' + (S.every(s => r.raw[s.key] !== "" && r.raw[s.key] != null) ? rawPct(r) + "%" : "–") + "</td>" +
      '<td><button class="del" type="button" ' + (r.id ? 'data-id="' + P.esc(r.id) + '"' : 'data-i="' + i + '"') + ' aria-label="Delete ' + P.esc(r.source) + '">Delete</button></td></tr>').join("");
    $("empty").hidden = log.length > 0;
    chart(rows.map(x => x.r));
    const full = rows.map(x => x.r).filter(r => S.every(s => r.scaled[s.key]));
    const latest = full.length ? total(full[full.length - 1]) : null;
    const last3 = full.slice(-3);
    const avg3 = last3.length ? Math.round(last3.reduce((a, r) => a + total(r), 0) / last3.length) : null;
    $("stats").innerHTML =
      '<div class="stat"><b>' + (latest ?? "–") + "</b><span>Latest</span></div>" +
      '<div class="stat"><b>' + (avg3 ?? "–") + "</b><span>Average, last 3</span></div>";
  }

  $("flForm").addEventListener("submit", e => {
    e.preventDefault();
    const msg = $("formMsg");
    const r = { id: P.makeId(), date: $("fDate").value, source: $("fSrc").value, raw: {}, scaled: {} };
    for (const s of S) {
      const rv = $("r_" + s.key).value, sv = $("s_" + s.key).value;
      if (rv !== "" && (+rv < 0 || +rv > s.max)) { msg.textContent = s.label + " raw score must be between 0 and " + s.max + "."; return; }
      if (sv !== "" && (+sv < 118 || +sv > 132)) { msg.textContent = s.label + " scaled score must be between 118 and 132."; return; }
      r.raw[s.key] = rv === "" ? "" : +rv;
      r.scaled[s.key] = sv === "" ? "" : +sv;
    }
    if (!r.date) { msg.textContent = "Pick the date you took the exam."; return; }
    if (S.every(s => r.scaled[s.key] === "" && r.raw[s.key] === "")) { msg.textContent = "Enter at least one section score."; return; }
    log = P.store.get(KEY, []); log.push(r); P.store.set(KEY, log);
    msg.textContent = "";
    S.forEach(s => { $("r_" + s.key).value = ""; $("s_" + s.key).value = ""; });
    render(); UI.toast("Exam logged");
  });
  $("body").addEventListener("click", e => {
    const b = e.target.closest(".del");
    if (!b) return;
    log = P.store.get(KEY, []);
    const at = b.dataset.id ? log.findIndex(x => x.id === b.dataset.id) : +b.dataset.i;
    if (at >= 0) log.splice(at, 1);
    P.store.set(KEY, log); render(); UI.toast("Exam deleted");
  });
  render();
})();
</script>
</body>
</html>
